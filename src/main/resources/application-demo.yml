# Perfil de prueba rápida SIN Oracle: H2 en memoria con dialecto Oracle.
# Ejecutar con:  mvn spring-boot:run -Dspring-boot.run.profiles=demo
spring:
  datasource:
    url: jdbc:h2:mem:sapi;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false
