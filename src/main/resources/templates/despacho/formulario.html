<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Despacho a Hornos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container" style="max-width: 500px;">
        <h2 class="mb-4 text-primary">Registrar Salida Rápida</h2>

        <div th:if="${mensajeExito}" class="alert alert-success fw-bold" th:text="${mensajeExito}"></div>
        <div th:if="${mensajeError}" class="alert alert-danger fw-bold" th:text="${mensajeError}"></div>

        <form th:action="@{/despacho/registrar}" method="post">
            <div class="mb-3">
        <label class="form-label fw-bold">Código del Producto (SKU):</label>
        <input type="text" name="codigoProducto" class="form-control form-control-lg" placeholder="Ej. PAN-001" required autofocus>
        </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Cantidad a retirar (Kg/Unidades):</label>
                <input type="number" step="0.01" name="cantidad" class="form-control form-control-lg" required>
            </div>
            <!-- Simulación del ID del panadero (En producción vendría de la sesión del Login) -->
            <input type="hidden" name="idPersonal" value="101"> 
            
            <button type="submit" class="btn btn-primary btn-lg w-100">DESCONTAR STOCK</button>
        </form>
    </div>
</body>
</html>
