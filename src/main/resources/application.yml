server:
  # 8090 para no chocar con otros proyectos locales que usan 8080.
  # Se puede sobreescribir con la variable de entorno SERVER_PORT.
  port: ${SERVER_PORT:8090}

spring:
  profiles:
    active: demo
  application:
    name: sapi

  # ------------------------------------------------------------------
  # Oracle PL/SQL (perfil por defecto)
  # ------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USERNAME:SAPI}
    password: ${DB_PASSWORD:sapi}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    # El esquema lo gobiernan los scripts PL/SQL (db/01_schema_oracle.sql)
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        "[format_sql]": true
        jdbc:
          "[time_zone]": America/Lima

  thymeleaf:
    cache: false

  mvc:
    format:
      date: yyyy-MM-dd

logging:
  level:
    "[com.panificadora.sapi]": DEBUG
